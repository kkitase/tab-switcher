<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tab Switcher</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" width="20" height="20" alt="" />
      <h1>Tab Switcher</h1>
    </header>
    <div class="shortcut">
      <span id="shortcut-label"></span>
      <kbd id="shortcut"></kbd>
    </div>
    <p id="not-set-help" class="warning" hidden></p>
    <p id="usage"></p>
    <button id="change" type="button"></button>
  </body>
</html>
